<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Ship Game</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Set canvas to full screen
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // Load background image
    const bg = new Image();
    bg.src = "assets/background.jpg"; // Ensure this path is correct

    // Load ship image (or use a rectangle for now)
    // const shipImg = new Image();
    // shipImg.src = "assets/ship.png"; // Optional if you have a ship image

    let ship = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 100,
      width: 50,
      height: 50
    };

    // Draw function
    function draw() {
      // Draw background only if image is loaded
      if (bg.complete) {
        ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
      } else {
        // Fallback in case background isn't loaded yet
        ctx.fillStyle = "black";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Draw ship (rectangle version)
      ctx.fillStyle = "lime";
      ctx.fillRect(ship.x, ship.y, ship.width, ship.height);

      // If using an image instead:
      // ctx.drawImage(shipImg, ship.x, ship.y, ship.width, ship.height);

      requestAnimationFrame(draw);
    }

    bg.onload = () => {
      draw();
    };

    // Error handling if the image fails to load
    bg.onerror = () => {
      console.error("Error loading background image");
    };
  </script>
</body>
</html>
